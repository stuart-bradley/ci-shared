name: Setup Flutter
description: Install Flutter, Just, cache Gradle, and pub get

# Note: codegen (build_runner) is intentionally NOT run here. `just check`
# (CI + release) already runs it, so running it here too would double-run
# build_runner. Workflows that build without `just check` (e2e) run
# `just codegen` explicitly.
inputs:
  flutter-version:
    description: >-
      Exact Flutter version, overriding the shared pin below for this caller
      only. Empty (the default, and what every reusable workflow passes when
      its own input is unset) means "use the shared pin".
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        channel: stable
        # THE SHARED FLUTTER PIN — one constant, every app, every workflow.
        #
        # The SDK was the last floating dependency: actions are SHA-pinned and
        # pubspec.lock is committed, but an unpinned stable auto-updates on the
        # runner, so a build changes underfoot with no commit to blame. Twice
        # now — the "compileFlutterBuildDebug not found" Gradle regression, then
        # 3.44.8's built-in Kotlin, which stops home_widget 0.9.1 compiling and
        # took out tasks-on-time's e2e and its next release.
        #
        # 3.44.6 is the last version all three apps were green on. It lives here
        # rather than in each workflow's input default because the workflows
        # pass their (empty) input straight through, and an explicit "" would
        # override an input default — so the fallback has to be at the point of
        # use. Moving it is deliberate: bump here, watch ci + e2e go green on
        # EVERY app, then move `v1`.
        flutter-version: ${{ inputs.flutter-version || '3.44.6' }}
        cache: true

    - name: Install Just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

    - name: Cache Gradle dependencies
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          gradle-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: flutter pub get
