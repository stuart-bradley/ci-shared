name: Setup Flutter
description: Install Flutter, Just, cache Gradle, and pub get

# Note: codegen (build_runner) is intentionally NOT run here. `just check`
# (CI + release) already runs it, so running it here too would double-run
# build_runner. Workflows that build without `just check` (e2e) run
# `just codegen` explicitly.
runs:
  using: composite
  steps:
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        channel: stable
        cache: true

    - name: Install Just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

    - name: Cache Gradle dependencies
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          gradle-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: flutter pub get
