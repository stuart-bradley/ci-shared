name: Flutter CI

# Reusable CI for the Flutter apps: lint shell scripts, run `just check`
# (codegen + analyze + format-check + unit/widget tests), and optionally a
# debug-APK smoke build. Callers keep their own push/pull_request triggers and
# concurrency.
on:
  workflow_call:
    inputs:
      smoke-build:
        description: "Run `just build-debug` after check (Android compile smoke test)"
        type: boolean
        default: false
      flutter-version:
        description: "Exact Flutter version to pin (empty = latest stable)"
        type: string
        default: ""

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: stuart-bradley/ci-shared/.github/actions/setup-flutter@v1
        with:
          flutter-version: ${{ inputs.flutter-version }}

      - name: Lint scripts
        run: just lint-scripts

      - name: Check
        run: just check

      # Only the smoke-build path does a full debug APK build, which is
      # disk-hungry enough to exhaust the runner ("No space left on device").
      # Free the unused preinstalled toolchains right before it.
      - name: Free disk space
        if: inputs.smoke-build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
            /opt/ghc /usr/local/share/powershell /usr/share/swift \
            /usr/local/.ghcup 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          df -h /

      - name: Smoke build (debug APK)
        if: inputs.smoke-build
        run: just build-debug
