name: Flutter CI

# Reusable CI for the Flutter apps: lint shell scripts, run `just check`
# (codegen + analyze + format-check + unit/widget tests), and optionally a
# debug-APK smoke build. Callers keep their own push/pull_request triggers and
# concurrency.
#
# With `coverage: true` the check step runs `just check-coverage` INSTEAD, so
# that recipe MUST be a superset of `check` — codegen + analyze + format-check
# + tests, with coverage collection and the floor added. Nothing here can
# enforce that (the recipe lives in the caller's justfile), so it is stated as
# a contract: an app that writes `check-coverage` as tests-plus-coverage alone
# would silently lose analyze and format-check on every PR, with a green job.
on:
  workflow_call:
    inputs:
      smoke-build:
        description: "Run `just build-debug` after check (Android compile smoke test)"
        type: boolean
        default: false
      release-smoke:
        description: "Build an unsigned release APK on push-to-main (release-only gates: lintVital, R8, resource shrinking)"
        type: boolean
        default: false
      flutter-version:
        description: "Exact Flutter version, overriding the shared pin in setup-flutter (empty = use the pin)"
        type: string
        default: ""
      coverage:
        # Runs `just check-coverage` INSTEAD of `just check`, so the suite runs
        # once, not twice. A separate coverage job would re-pay checkout,
        # free-disk-space, setup-flutter, pub get AND codegen (.g.dart is
        # gitignored) before repeating the whole test run — several minutes per
        # PR, in every caller, to re-run tests this job already ran.
        #
        # Defaults false so existing callers (watch-nook et al.) are unaffected
        # by the `v1` re-tag until they opt in. A caller that sets this true
        # MUST define a `check-coverage` recipe, and it must be a SUPERSET of
        # `check` (see the file header) — otherwise the step either dies on
        # "Justfile does not contain recipe", or worse, quietly runs fewer
        # gates than `check` did.
        description: "Run `just check-coverage` in place of `just check` (collects coverage + enforces the repo's floor)"
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reclaim runner disk BEFORE anything downloads/builds. The runner image's
      # baseline free disk periodically shrinks under a runner-image rollout,
      # and `just check` (codegen + tests) then exhausts it and the runner dies
      # with "No space left on device" long before the smoke build — so this
      # must run first, unconditionally, not gated to the smoke build.
      - uses: stuart-bradley/ci-shared/.github/actions/free-disk-space@v1

      # Validate the Play "What's new" text BEFORE the expensive steps, so an
      # over-long section fails in seconds rather than at tag time — which is
      # where it used to fail, after the PR had already merged.
      #
      # This checks the section pubspec.yaml's `version:` points at, so it is
      # the VERSION-BUMP PR where it bites: that PR is the first time the
      # about-to-ship section is the selected one. On an ordinary feature PR it
      # re-checks the last released section, which always passes.
      #
      # Deliberately NOT a check of `## Unreleased` on every PR: bullets land
      # there one PR at a time and only become a release when the bump PR
      # renames the heading, which this already gates. The ceiling: an
      # Unreleased section can still grow past 500 chars unnoticed, and the
      # bump PR is where you find out. Pass a section override here if that
      # ever costs more than it saves.
      #
      # Cannot catch the OTHER half of the trap — an EMPTY section warns and
      # silently ships default.txt (exit 0 by design, so a missing note never
      # fails a release). Nothing here can tell "deliberately no notes" from
      # "forgot the notes".
      - uses: stuart-bradley/ci-shared/.github/actions/play-release-notes@v1

      - uses: stuart-bradley/ci-shared/.github/actions/setup-flutter@v1
        with:
          flutter-version: ${{ inputs.flutter-version }}

      - name: Lint scripts
        run: just lint-scripts

      # Static, no build: the one release-only failure `just check` structurally
      # cannot see (R8 strips Dart-only resources; debug builds aren't shrunk).
      - uses: stuart-bradley/ci-shared/.github/actions/verify-dart-resources@v1

      # Exactly one of these runs, for EVERY input shape. The two conditions are
      # strict complements of one expression, deliberately — the obvious
      # `inputs.coverage` / `!inputs.coverage` pair is wrong in one direction and
      # the tempting `== true` / `!= true` pair is wrong in the other:
      #
      #   * A `type: boolean` workflow_call input passed as `${{ … }}` arrives as
      #     a STRING, not a boolean (the trap already documented on
      #     flutter-e2e.yml's install-patrol).
      #   * `!inputs.coverage` mishandles the string "false", which is truthy.
      #   * `== true` mishandles the string "true": GitHub coerces mismatched
      #     operand types to Number, so `true` -> 1 and `"true"` -> NaN, and every
      #     NaN comparison is false. `"true" == true` is FALSE and
      #     `"true" != true` is TRUE, so a caller writing
      #     `coverage: ${{ github.event_name == 'pull_request' }}` would run the
      #     plain check and SILENTLY SKIP the coverage floor — green job, gate
      #     not enforced, no warning. That is the dangerous direction.
      #
      # Accepting both shapes explicitly makes every value land on exactly one
      # branch, so no caller spelling can disable the gate or skip both steps.
      - name: Check
        if: ${{ !(inputs.coverage == true || inputs.coverage == 'true') }}
        run: just check

      - name: Check (with coverage)
        if: ${{ inputs.coverage == true || inputs.coverage == 'true' }}
        run: just check-coverage

      - name: Smoke build (debug APK)
        if: inputs.smoke-build
        run: just build-debug

      # The release variant's whole failure surface -- lintVital, R8/minification,
      # resource shrinking, release-only manifest merging -- is unexercised by
      # `just check`, the debug smoke build and E2E alike, so it first fails at
      # tag time. It did, twice: watch-nook's AGP 9.3.1 bump (#28) and
      # tasks-on-time v1.4.0's `lintVitalAnalyzeRelease` crash (see the JDK pin
      # in setup-flutter, which went unseen for 18 days for exactly this reason).
      #
      # UNSIGNED, and needs no secrets: the apps' android/app/build.gradle.kts
      # falls back to signingConfigs.debug when key.properties is absent.
      #
      # push-only, deliberately. GitHub has no per-job path filter, so on
      # pull_request this would bill EVERY PR including doc-only ones -- and it
      # is not cheap: MEASURED 671.5s (11.2 min) on tasks-on-time's first run
      # (cold Gradle cache), not the ~4 min originally guessed. R8 and resource
      # shrinking are the expensive part, and they are also the point. On
      # push-to-main it costs nothing on PRs and still surfaces the breakage
      # minutes after merge rather than at the next tag.
      #
      # R8 really does run: Flutter's own Gradle plugin sets
      # `releaseBuildType.isMinifyEnabled = true` (FlutterPlugin.kt), so the apps
      # need no `isMinifyEnabled` of their own -- verified by r8_metadata,
      # shrunk_resources_binary_format and mapping/release in the build output.
      #
      # A direct command, not a `just` recipe. THREE of the four apps' `build-debug`
      # is literally `flutter build apk --debug --no-pub`; watch-nook's is a bash
      # recipe that appends `--dart-define-from-file=secrets.json` when that file
      # exists, and it degrades to the plain command here only because CI never
      # writes secrets.json for a non-release build. So a per-app recipe would be
      # mostly identical files of churn today -- but that is a coincidence, not an
      # invariant. THE TRIPWIRE: the moment any app's RELEASE build needs a flag
      # (a dart-define, a flavour), this must become a `just release-smoke`
      # recipe, exactly as `e2e-build` is owned by the apps.
      #
      # --target-platform android-arm64 rather than the default (arm + arm64 +
      # x64). Every gate this step exists for -- lintVitalAnalyze, R8/minification,
      # resource shrinking, release manifest merging -- is VARIANT-scoped, not
      # ABI-scoped, so the extra ABIs re-run gen_snapshot AOT over the whole Dart
      # program for no additional signal.
      #
      # It narrows the DART AOT, not the whole APK: plugin AARs still ship their
      # own prebuilt .so, so the artifact still contains armeabi-v7a. Verified on
      # tasks-on-time -- the arm64 build is 26.2MB against 64.1MB fat, and still
      # produces mapping/release, r8_metadata and shrunk_resources_binary_format,
      # i.e. every gate above genuinely ran.
      #
      # Expect a large saving against the 671.5s fat measurement, but the CI
      # number is not in yet -- record it here once a push-to-main run has one,
      # rather than quoting the local 3m38s, which has a warm cache.
      #
      # The shipped artifact is unaffected: `just release-apk-ci` at tag time
      # still builds the full fat APK, so per-ABI coverage moves off the
      # every-push path rather than disappearing.
      #
      # NO `--no-pub` HERE, unlike the debug smoke build above. Flutter strips
      # DEV-dependency plugins from the release plugin registrant, and it does
      # that during the plugin refresh that runs as part of pub get -- which
      # `--no-pub` skips. Skip it and `GeneratedPluginRegistrant.java` keeps the
      # entries from the last debug/E2E build, so the release compile fails with
      # `package dev.flutter.plugins.integration_test does not exist` (and
      # `pl.leancode.patrol` on the patrol apps). Reproduced on tasks-on-time and
      # well-quill from a clean tree; both pass once the flag is dropped.
      #
      # It is safe on the debug build because debug KEEPS the dev-dependency
      # plugins, so that registrant is already correct. The extra pub get costs
      # seconds against a warm pub cache.
      - name: Release smoke build (unsigned release APK)
        if: inputs.release-smoke && github.event_name == 'push'
        run: flutter build apk --release --target-platform android-arm64
