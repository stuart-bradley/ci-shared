name: Self test

# ci-shared's own CI. The action scripts here only ever run inside a consuming
# app's workflow, so without this a broken one surfaces mid-release — after the
# `v1` tag has already moved and every app has picked it up.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Shellcheck
        run: shellcheck .github/actions/*/*.sh

      - name: Release-notes self-check
        run: .github/actions/play-release-notes/play-release-notes.test.sh
