name: Flutter E2E

# Reusable Android-emulator E2E job. Callers keep their own pull_request
# trigger + paths + concurrency. The emulator boots ONCE: on an AVD-cache miss
# the run step creates the AVD and the post-job cache saves it (only on a
# passing run — actions/cache is post-if: success()); on a hit it reuses it.
on:
  workflow_call:
    inputs:
      api-level:
        description: "Android API level for the emulator"
        type: number
        default: 31
      disk-size:
        description: "Emulator data partition size (e.g. '2G', '4G')"
        type: string
        default: "2G"
      install-patrol:
        description: "Activate patrol_cli 3.11.0 before running E2E (Patrol apps)"
        type: boolean
        default: false
      timeout-minutes:
        description: "Job timeout (ceiling; only bills when a job hangs)"
        type: number
        default: 20
      flutter-version:
        description: "Exact Flutter version to pin (empty = latest stable)"
        type: string
        default: ""

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: stuart-bradley/ci-shared/.github/actions/setup-flutter@v1
        with:
          flutter-version: ${{ inputs.flutter-version }}

      - name: Install patrol_cli
        if: inputs.install-patrol
        run: |
          dart pub global activate patrol_cli 3.11.0
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      # setup-flutter does not run codegen; E2E has no `just check`, so the
      # aggregated test build needs generated code generated explicitly here.
      - name: Generate code
        run: just codegen

      # Free disk space on the GitHub runner (emulator + build are disk-hungry).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
            /opt/ghc /usr/local/share/powershell /usr/share/swift \
            /usr/local/.ghcup 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          df -h /

      # Enable KVM so the emulator is hardware-accelerated (else it times out).
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The E2E job runs a debug build alongside a live emulator on a ~4 vCPU /
      # 16 GB runner. Cap Gradle to 3 workers (CI-only) so the build leaves a
      # core for the emulator's QEMU2 main loop. ~/.gradle/gradle.properties
      # overrides android/gradle.properties.
      - name: Constrain Gradle for the emulator
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.workers.max=3" >> ~/.gradle/gradle.properties

      - name: Cache AVD
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api${{ inputs.api-level }}-x86_64-${{ inputs.disk-size }}-emu11237101-${{ runner.os }}

      # Single emulator boot per attempt. Cold boot (-no-snapshot-load
      # -no-snapshot-save): no RAM snapshot is saved/cached, so a run can't hit
      # "cannot load snapshot: default_boot" from emulator-version drift across
      # runs. force-avd-creation: false reuses the cached AVD on a hit, creates
      # it on a miss (the post-job Cache AVD step saves it only when the JOB
      # passes — so a retried infra crash still caches, a hard failure doesn't).
      #
      # RETRY-ON-INFRA-CRASH (attempt -> conditional retry -> gate). The
      # swiftshader GPU translator can die mid-run ("Failed to find ColorBuffer"),
      # which either kills the emulator (patrol reports "Failed: 0" yet exits
      # nonzero) or degrades it so a widget wait times out (a visibility
      # TimeoutException surfacing as Failed: N). Either way a green suite is
      # failed by dead/degraded infra and it can strike any PR on any of the three
      # apps. We retry ONCE on a fresh emulator when attempt 1's captured output
      # bears that infra signature (Failed: 0, TimeoutException, or ColorBuffer).
      # A genuine assertion mismatch bears none of those, so it skips the retry and
      # fails fast — the re-run can't mask it (and a deterministic timeout-shaped
      # bug recurs on the single retry anyway). The two runner steps must keep
      # IDENTICAL emulator config (GitHub Actions has no YAML anchors). A retry
      # roughly doubles worst-case wall time, so callers should size
      # timeout-minutes to fit one retry (well-quill uses 30).
      - name: Run E2E tests (attempt 1)
        id: e2e1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        with:
          api-level: ${{ inputs.api-level }}
          # Pin emulator 33.1.24.0 (build 11237101). Recent builds (36.x) hit
          # "Failed to find ColorBuffer" fatally on ~every headless run; the
          # documented fix is this downgrade (#64 bucket A). Both runner steps
          # MUST keep the same build.
          emulator-build: "11237101"
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-boot-timeout: 600
          disk-size: ${{ inputs.disk-size }}
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          # MUST be ONE line: the emulator-runner runs `script` one line per
          # `sh -c`, so a multi-line block loses `rc` across shells and splits
          # `if/fi` (`sh: Syntax error ... expecting "fi"`, exit 2) even when all
          # tests pass. No pipe either (pipefail/PIPESTATUS aren't portable; a
          # mis-read exit could mask a real failure). Leaves e2e-output.txt in the
          # workspace for the classify step and dumps logcat on failure via `||`.
          # $GITHUB_OUTPUT can't be set from here (subprocess), so infra
          # classification happens in the next (normal) run step.
          script: just e2e > e2e-output.txt 2>&1; rc=$?; cat e2e-output.txt; [ "$rc" -eq 0 ] || adb logcat -d > emulator-logcat.txt 2>&1; exit "$rc"

      # Classify attempt 1's failure in a NORMAL run step, where $GITHUB_OUTPUT
      # actually sets a step output (it can't from inside the emulator-runner
      # script above). Reads the e2e-output.txt attempt 1 left in the workspace.
      # Infra signature = emulator-killed ("Failed: 0" plus the nonzero exit that
      # got us here), a GPU-degraded visibility "TimeoutException", or "Failed to
      # find ColorBuffer" (rare in captured output — it mostly prints to the
      # emulator host stderr / action log). A genuine assertion mismatch bears
      # none of these, so infra stays unset and the job fails fast.
      - name: Classify attempt 1 failure
        id: classify
        if: steps.e2e1.outcome == 'failure'
        run: |
          if grep -qE 'Failed: 0|TimeoutException|Failed to find ColorBuffer' e2e-output.txt; then
            echo "infra=true" >> "$GITHUB_OUTPUT"
            echo "::warning::E2E attempt 1 hit an emulator infra crash — retrying once on a fresh emulator."
          else
            echo "No infra signature in attempt 1 output — real failure, no retry."
          fi

      # Retry ONCE, on a fresh emulator, only when attempt 1 died from the infra
      # signature (classify only runs on an attempt-1 failure). Emulator config
      # MUST match attempt 1.
      - name: Run E2E tests (retry after infra crash)
        id: e2e2
        if: steps.classify.outputs.infra == 'true'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        with:
          api-level: ${{ inputs.api-level }}
          # Pin emulator 33.1.24.0 (build 11237101). Recent builds (36.x) hit
          # "Failed to find ColorBuffer" fatally on ~every headless run; the
          # documented fix is this downgrade (#64 bucket A). Both runner steps
          # MUST keep the same build.
          emulator-build: "11237101"
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-boot-timeout: 600
          disk-size: ${{ inputs.disk-size }}
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: just e2e > e2e-output.txt 2>&1; rc=$?; cat e2e-output.txt; [ "$rc" -eq 0 ] || adb logcat -d > emulator-logcat.txt 2>&1; exit "$rc"

      # Upload both attempts' diagnostics (the retry overwrites the files, so this
      # holds the last/most-relevant failure). always() so a pass and a failing
      # attempt both ship their captured output+logcat (a job-level timeout can't
      # run it, but the redirect writes e2e-output.txt incrementally on disk).
      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-diagnostics
          path: |
            e2e-output.txt
            emulator-logcat.txt
          if-no-files-found: ignore

      # Gate: pass iff SOME attempt succeeded. A real test failure (attempt 1
      # failed, infra flag unset -> retry skipped) reaches here with no success
      # and fails the job — the retry can't mask it. Both attempts are
      # continue-on-error, so this gate is the single source of the job verdict.
      - name: E2E result gate
        if: always()
        run: |
          a1='${{ steps.e2e1.outcome }}'
          a2='${{ steps.e2e2.outcome }}'
          if [ "$a1" = 'success' ] || [ "$a2" = 'success' ]; then
            echo "E2E passed (attempt1=$a1, attempt2=${a2:-skipped})"
            exit 0
          fi
          echo "E2E failed (attempt1=$a1, infra=${{ steps.classify.outputs.infra }}, attempt2=${a2:-skipped})"
          exit 1
