name: Flutter Release APK

# Reusable: build a signed **universal APK** (with the app's baked API key) and
# attach it to the GitHub Release for the pushed tag. `just check` runs BEFORE
# the signing / API secrets are in scope. Callers keep their own tag trigger,
# pass `secrets: inherit`, and grant `contents: write` on the calling job.
#
# The consuming app must expose `just release-apk-ci`: build the signed release
# APK from env — KEYSTORE_BASE64 + STORE_PASSWORD + KEY_ALIAS + KEY_PASSWORD for
# signing, TMDB_API_KEY + TMDB_READ_TOKEN for the baked key, BUILD_NAME for the
# versionName — leaving it at build/app/outputs/flutter-apk/app-release.apk.
on:
  workflow_call:
    inputs:
      flutter-version:
        description: "Exact Flutter version to pin (empty = latest stable)"
        type: string
        default: ""
    secrets:
      KEYSTORE_BASE64:
        required: true
      STORE_PASSWORD:
        required: true
      KEY_ALIAS:
        required: true
      KEY_PASSWORD:
        required: true
      TMDB_API_KEY:
        required: true
      TMDB_READ_TOKEN:
        required: true

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: stuart-bradley/ci-shared/.github/actions/setup-flutter@v1
        with:
          flutter-version: ${{ inputs.flutter-version }}

      # Verification runs WITHOUT the signing / API secrets in scope.
      - name: Verify
        run: just check

      - name: Build signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          BUILD_NAME: ${{ github.ref_name }}
        run: just release-apk-ci

      # Create the Release for this tag (or upload to it if it already exists),
      # using the preinstalled gh CLI — no third-party action to pin.
      - name: Publish APK to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          gh release create "$GITHUB_REF_NAME" "$apk" \
            --title "$GITHUB_REF_NAME" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" "$apk" --clobber
